<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOTargetCL · Administración de Packing</title>

<style>
/* Layout: menú lateral fijo + contenido; en móvil el menú se despliega (pensado para la pistola Unitech EA520) */
:root{
  --gt-verde:#2f6b3f; --gt-verde-osc:#1c3426; --gt-verde-cl:#e8f2ea;
  --gt-rojo:#b8323a; --gt-ambar:#d98e04; --gt-gris:#6b7280;
  --gt-bg:#f4f6f3; --gt-borde:#e2e7e1; --gt-card:#ffffff;
}
body{background:var(--gt-bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1f2a22;}
.gt-layout{display:flex;min-height:100vh;}
.gt-sidebar{width:236px;background:var(--gt-verde-osc);color:#fff;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:1030;transition:transform .2s;}
.gt-brand{display:flex;align-items:center;gap:.7rem;padding:1.1rem 1rem;border-bottom:1px solid rgba(255,255,255,.08);}
.gt-logo{width:38px;height:38px;border-radius:10px;background:var(--gt-rojo);display:grid;place-items:center;font-size:1.25rem;color:#fff;}
.gt-brand-name{font-weight:700;letter-spacing:.2px;}
.gt-brand-name b{color:#f3a7ab;font-weight:700;}
.gt-brand-sub{font-size:.75rem;color:rgba(255,255,255,.6);}
.gt-nav{padding:.75rem .5rem;flex:1;overflow-y:auto;}
.gt-nav-link{display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:8px;color:rgba(255,255,255,.78);text-decoration:none;font-size:.93rem;margin-bottom:2px;}
.gt-nav-link:hover{background:rgba(255,255,255,.07);color:#fff;}
.gt-nav-link.active{background:var(--gt-verde);color:#fff;}
.gt-nav-link .gt-ro{margin-left:auto;font-size:.8rem;opacity:.6;}
.gt-sidebar-foot{padding:.8rem 1rem;border-top:1px solid rgba(255,255,255,.08);font-size:.8rem;color:rgba(255,255,255,.55);}
.gt-main{flex:1;margin-left:236px;min-width:0;}
.gt-topbar{display:flex;align-items:center;gap:.75rem;background:#fff;border-bottom:1px solid var(--gt-borde);padding:.7rem 1.4rem;position:sticky;top:0;z-index:1020;}
.gt-title{font-size:1.2rem;margin:0;font-weight:650;}
.gt-badge-perfil{background:var(--gt-verde-cl);color:var(--gt-verde);font-weight:600;}
.gt-content{padding:1.4rem;}
@media (max-width:991px){
  .gt-sidebar{transform:translateX(-100%);} .gt-sidebar.open{transform:none;}
  .gt-main{margin-left:0;} .gt-content{padding:1rem;}
}
.gt-card{background:var(--gt-card);border:1px solid var(--gt-borde);border-radius:12px;padding:1rem 1.1rem;height:100%;min-width:0;}
.gt-card h6{font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--gt-gris);font-weight:650;margin-bottom:.8rem;}
.gt-kpi{display:flex;align-items:center;gap:.9rem;}
.gt-kpi .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;flex-shrink:0;}
.gt-kpi .val{font-size:1.55rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;}
.gt-kpi .lbl{font-size:.8rem;color:var(--gt-gris);}
a.gt-kpi-link{color:inherit;text-decoration:none;} a.gt-kpi-link:hover .gt-card{border-color:var(--gt-verde);}
.ic-verde{background:var(--gt-verde-cl);color:var(--gt-verde);}
.ic-rojo{background:#f8e5e6;color:var(--gt-rojo);}
.ic-ambar{background:#fbf0d9;color:var(--gt-ambar);}
.ic-azul{background:#e3edf8;color:#2b5d94;}
.gt-chart{position:relative;height:260px;}
.gt-chart.sm{height:220px;}
table.dataTable{font-size:.88rem;}
table.dataTable thead th{background:#f7f9f6;font-weight:650;white-space:nowrap;}
.dt-buttons.btn-group{gap:.35rem;} .dt-buttons.btn-group>.btn{border-radius:.375rem !important;font-size:.8rem;}
.gt-tarja{font-family:ui-monospace,Consolas,monospace;font-weight:600;white-space:nowrap;}
.nowrap td{white-space:nowrap;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.badge.st{font-weight:600;}
.st-ok{background:#e1f0e4;color:#22663a;} .st-warn{background:#fbefd5;color:#94600a;}
.st-bad{background:#f8e1e3;color:#9b2730;} .st-info{background:#e1ecf8;color:#25548a;} .st-mute{background:#eceeec;color:#555;}
.gt-scan{font-family:ui-monospace,Consolas,monospace;font-size:1.15rem;letter-spacing:1px;}
.gt-scan-wrap{position:relative;}
.gt-scan-wrap .bi{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--gt-gris);font-size:1.2rem;}
.gt-scan-wrap input{padding-left:2.5rem;}
.gt-timeline{list-style:none;padding:0;margin:0;position:relative;}
.gt-timeline:before{content:"";position:absolute;left:15px;top:4px;bottom:4px;width:2px;background:var(--gt-borde);}
.gt-timeline li{position:relative;padding:0 0 1rem 44px;}
.gt-timeline .dot{position:absolute;left:4px;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:#fff;border:2px solid var(--gt-verde);color:var(--gt-verde);}
.gt-timeline .dot.bad{border-color:var(--gt-rojo);color:var(--gt-rojo);}
.gt-timeline .t{font-weight:600;} .gt-timeline .m{font-size:.82rem;color:var(--gt-gris);}
.gt-login-bg{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--gt-verde-osc),#2f5a3a 60%,#7a2a2f);padding:1rem;}
.gt-login{width:100%;max-width:410px;background:#fff;border-radius:16px;padding:2rem;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.gt-matriz td,.gt-matriz th{text-align:center;vertical-align:middle;}
.gt-matriz td:first-child,.gt-matriz th:first-child{text-align:left;}
.gt-matriz select{min-width:125px;font-size:.8rem;}
.btn-gt{background:var(--gt-verde);border-color:var(--gt-verde);color:#fff;} .btn-gt:hover{background:#255733;border-color:#255733;color:#fff;}
.gt-demo-tag{font-size:.7rem;background:#fbefd5;color:#94600a;border-radius:4px;padding:.1rem .4rem;font-weight:600;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="vistaLogin" class="gt-login-bg" hidden>
  <div class="gt-login">
    <div class="text-center mb-4">
      <div class="gt-logo mx-auto mb-2" style="width:56px;height:56px;font-size:1.7rem"><i class="bi bi-bullseye"></i></div>
      <h1 class="h4 mb-0 fw-bold">GOTarget<span style="color:var(--gt-rojo)">CL</span></h1>
      <div class="text-muted small">Trazabilidad de bins y pallets ·</div>
    </div>
    <div id="loginError" class="alert alert-danger py-2 small" hidden></div>
    <form id="frmLogin" autocomplete="off">
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="lgUsuario">Usuario</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="lgUsuario" class="form-control" required></div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold" for="lgClave">Contraseña</label>
        <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="lgClave" class="form-control" required></div>
      </div>
      <button class="btn btn-gt w-100"><i class="bi bi-box-arrow-in-right me-1"></i> Ingresar</button>
    </form>
    <hr class="my-4">
    <div class="small">
      <div class="fw-semibold mb-2 text-muted"><i class="bi bi-info-circle me-1"></i>Usuarios de demostración (clic para completar)</div>
      <div class="d-flex flex-wrap gap-1" id="loginDemo"></div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="vistaApp" class="gt-layout" hidden>
  <aside class="gt-sidebar" id="gtSidebar">
    <div class="gt-brand">
      <span class="gt-logo"><i class="bi bi-bullseye"></i></span>
      <div><div class="gt-brand-name">GOTarget<b>CL</b></div><div class="gt-brand-sub">Packing San Clemente</div></div>
    </div>
    <nav class="gt-nav" id="gtNav"></nav>
    <div class="gt-sidebar-foot">Temporada 2026 · Demo</div>
  </aside>
  <div class="gt-main">
    <header class="gt-topbar">
      <button class="btn btn-sm btn-light d-lg-none" id="btnMenu" aria-label="Menú"><i class="bi bi-list"></i></button>
      <h1 class="gt-title" id="gtTitulo"></h1>
      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="text-end lh-sm d-none d-sm-block">
          <div class="fw-semibold" id="gtNombre"></div>
          <span class="badge gt-badge-perfil" id="gtPerfil"></span>
        </div>
        <button class="btn btn-sm btn-outline-secondary" id="btnSalir" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>
    <main class="gt-content" id="gtMain"></main>
  </div>
</div>

  // Ubicaciones

  [['Cámara 1', 'Cámara MP', 120], ['Cámara 2', 'Cámara MP', 120], ['Cámara 3', 'Cámara MP', 100], ['Cámara 4', 'Cámara MP', 100],
   ['Cámara Calibrado', 'Cámara Calibrado', 150], ['Línea 1', 'Línea', 0], ['Línea 2', 'Línea', 0], ['Pre-frío 1', 'Pre-frío', 40], ['Pre-frío 2', 'Pre-frío', 40],

  // Operación de ejemplo, reproducible
  let s = 2026;
  const R = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const camarasMP = ['Cámara 1', 'Cámara 2', 'Cámara 3', 'Cámara 4'];
  const binsMP = new Map();
  let nGuia = 48210;
  for (let d = 9; d >= 0; d--) {

    for (let g = 0; g < guias; g++) {

      const pr = PR[ri(0, PR.length - 1)], v = VARIEDADES[ri(0, VARIEDADES.length - 1)], cam = camarasMP[ri(0, 3)], n = ri(6, 12);

  }
  // Objeciones de Control de Calidad
  const plagas = ['Pulgón lanígero', 'Arañita roja', 'Chanchito blanco', 'Pulgón lanígero'];
  const ids = [...binsMP.keys()], objetados = new Set();
  [7, 23, 61, 118].forEach((pos, k) => {

  });
  // Movimientos entre cámaras (algunos pendientes de aprobación)
  const motivos = ['Reordenamiento de cámara', 'Consolidación por variedad', 'Liberar espacio para recepción'];
  let k = 0;
  for (const [id, b] of binsMP) {

    const pend = k % 6 === 5;
    mov(id, 'Movimiento', U[b.cam], U[dest], 'projas', pend ? 'Otro: solicitud de bodega externa' : motivos[k % 3], pend ? 'Pendiente' : 'Aprobado', pend ? null : 'auto',
      fechaRel(Math.max(0, b.dia - 1), 11, (k * 7) % 60));
    if (!pend) { binId(id).ubicacion_id = U[dest]; b.cam = dest; }
    k++;
  }
  // Órdenes de trabajo
  const usados = new Set();
  const plan = [['Cerrada', 6, 'Línea 1', 14], ['Cerrada', 4, 'Línea 2', 12], ['Cerrada', 2, 'Línea 1', 16], ['En proceso', 0, 'Línea 2', 10], ['Planificada', 0, 'Línea 1', 8]];
  let nOT = 0;
  for (const [estado, dia, linea, n] of plan) {
    const porVar = {};
    for (const [id, b] of binsMP) { if (usados.has(id) || objetados.has(id) || b.dia <= dia) continue; (porVar[b.variedad] = porVar[b.variedad] || []).push(id); }
    const v = Object.keys(porVar).sort((a, b) => porVar[b].length - porVar[a].length)[0];
    if (!v) continue;
    const sel = porVar[v].slice(0, n);
    sel.forEach(id => usados.add(id));
    const kgIn = Math.round(sum(sel, id => binsMP.get(id).kg) * 10) / 10;

    const num = `OT-2026-${String(310 + nOT).padStart(4, '0')}`;

    const nCal = Math.max(1, Math.round(kgCAL / 380)); for (let i = 0; i < nCal; i++) salidas.push(['CAL', r1(kgCAL / nCal), CALIBRES[(i + 2) % 7], 'Cámara Calibrado', 'En cámara']);

      document.getElementById('otTodos').checked = false; sumar();
    };
    selVar.onchange = cargarBins; selV.onchange = cargarBins; tb.addEventListener('change', sumar);
    document.getElementById('otTodos').onchange = function () { tb.querySelectorAll('.chk').forEach(c => c.checked = this.checked); sumar(); };
    document.getElementById('btnCrearOT').onclick = async () => {
      const ids = [...tb.querySelectorAll('.chk:checked')].map(c => +c.value);
      const r = accion('ordenes', 'RW', () => {
        if (!selVar.value || !ids.length) return { ok: false, msg: 'Indica variedad, línea y al menos un bin' };
        const vuelta = +selV.value, disp = disponibles(selVar.value, vuelta).map(b => b.id);
        if (!ids.every(id => disp.includes(id))) return { ok: false, msg: 'Algunos bins ya no están disponibles. Recarga la lista.' };
        const kg = Math.round(sum(ids, id => binId(id).kg) * 10) / 10;
        const ult = db.ots.length ? Math.max(...db.ots.map(o => parseInt(o.numero.slice(-4), 10))) : 0;
        const numero = `OT-${new Date().getFullYear()}-${String(ult + 1).padStart(4, '0')}`;
        const ot = ins('ots', { numero, fecha: ahora(), variedad: selVar.value, linea_id: +document.getElementById('otLinea').value, vuelta, estado: 'Planificada', kg_entrada: kg, kg_salida: 0, creado_por: yo.usuario, cerrado_en: null, observacion: null });
        ids.forEach(id => { ins('ot_bins', { ot_id: ot.id, bin_id: id }); binId(id).estado = 'Asignado OT'; });
        return { ok: true, msg: `${numero} creada con ${ids.length} bins (${num(kg, 0)} kg)` };
      });
      if (!r.ok) return error(r.msg);
      bootstrap.Modal.getInstance(document.getElementById('mdlNueva')).hide();
      await ok(r.msg); recargar();
    };

  $main().querySelectorAll('[data-ver]').forEach(b => b.onclick = () => {

    const sal = db.bins.filter(x => x.ot_origen_id === o.id);

    document.getElementById('detTitulo').innerHTML = esc(o.numero) + ' ' + badge(o.estado);
    document.getElementById('detCuerpo').innerHTML = `
      <div class="row g-3 mb-3">
        <div class="col-md-3"><div class="gt-card"><div class="small text-muted">Variedad · línea</div><div class="fw-semibold">${esc(o.variedad)}</div><div class="small">${esc(ubicNom(o.linea_id))} · ${o.vuelta === 1 ? '1ra vuelta' : '2da vuelta'}</div></div></div>
        <div class="col-md-3"><div class="gt-card"><div class="small text-muted">Kg entrada</div><div class="fs-4 fw-bold">${num(o.kg_entrada)}</div></div></div>
        <div class="col-md-3"><div class="gt-card"><div class="small text-muted">Kg salida</div><div class="fs-4 fw-bold">${o.kg_salida ? num(o.kg_salida) : '—'}</div></div></div>
        <div class="col-md-3"><div class="gt-card"><div class="small text-muted">Cuadratura</div><div class="fs-4 fw-bold">${o.kg_salida ? num((o.kg_salida - o.kg_entrada) / o.kg_entrada * 100) + ' %' : '—'}</div><div class="small text-muted">${esc(o.observacion || '')}</div></div></div>
      </div>
      ${sal.length ? `<div class="mb-3 d-flex flex-wrap gap-2">${Object.entries(res).map(([t, v]) => `<span class="badge st st-ok fs-6">${TIPO_BIN[t][0]}: ${v.n} · ${num(v.kg)} kg (${num(v.kg / o.kg_entrada * 100)} %)</span>`).join('')}</div>` : ''}
      <div class="row g-3">
        <div class="col-lg-5"><h6 class="small fw-bold">Entradas (${ent.length})</h6><table class="table table-sm"><thead><tr><th>Tarja</th><th class="num">Kg</th><th>Estado</th></tr></thead><tbody>
          ${ent.map(e => `<tr><td>${linkT(e.tarja)}</td><td class="num">${num(e.kg)}</td><td>${badge(e.estado)}</td></tr>`).join('')}</tbody></table></div>
        <div class="col-lg-7"><h6 class="small fw-bold">Salidas tarjadas (${sal.length})</h6>
          ${sal.length ? `<table class="table table-sm"><thead><tr><th>Tarja</th><th>Tipo</th><th>Calibre</th><th class="num">Kg</th><th>Ubicación</th></tr></thead><tbody>
          ${sal.map(s => `<tr><td>${linkT(s.tarja)}</td><td>${tipoBin(s.tipo)}</td><td>${esc(s.calibre || '—')}</td><td class="num">${num(s.kg)}</td><td class="small">${esc(ubicNom(s.ubicacion_id))}</td></tr>`).join('')}</tbody></table>`
          : '<div class="text-muted small">Aún sin salidas (se generan al cerrar la OT).</div>'}</div>
      </div>`;
    bootstrap.Modal.getOrCreateInstance(document.getElementById('mdlDetalle')).show();
  });
  document.getElementById('mdlDetalle').addEventListener('click', ev => { if (ev.target.closest('a[href^="#"]')) bootstrap.Modal.getInstance(document.getElementById('mdlDetalle'))?.hide(); });

  $main().querySelectorAll('[data-iniciar]').forEach(b => b.onclick = async () => {
    const o = db.ots.find(x => x.id === +b.dataset.iniciar);
    if (!await confirmar('¿Iniciar ' + o.numero + '?', 'Los bins asignados se moverán a la línea de proceso (abastecimiento).', 'Iniciar')) return;
    const r = accion('ordenes', 'RW', () => {
      if (o.estado !== 'Planificada') return { ok: false, msg: 'La OT no está planificada' };
      db.ot_bins.filter(x => x.ot_id === o.id).forEach(x => { const bn = binId(x.bin_id);
        mov(bn.id, 'Abastecimiento', bn.ubicacion_id, o.linea_id, yo.usuario, 'Abastecimiento ' + o.numero); bn.ubicacion_id = o.linea_id; bn.estado = 'En proceso'; });
      o.estado = 'En proceso';
      return { ok: true, msg: o.numero + ' en proceso: bins abastecidos a la línea' };
    });
    if (!r.ok) return error(r.msg);
    await ok(r.msg); recargar();
  });

  $main().querySelectorAll('[data-cerrar]').forEach(b => b.onclick = async () => {
    const o = db.ots.find(x => x.id === +b.dataset.cerrar), kg = o.kg_entrada, v2 = o.vuelta === 2;
    const sug = v2 ? { PT: .80, CAL: 0, COM: .15, DES: .05 } : { PT: .62, CAL: .20, COM: .12, DES: .06 };
    const fila = (t, nombre, unidad) => `<tr><td class="text-start">${nombre}</td>
      <td><input type="number" step="0.1" class="form-control form-control-sm num kgSal" id="kg_${t}" value="${(kg * sug[t]).toFixed(1)}" ${t === 'CAL' && v2 ? 'disabled' : ''} aria-label="Kg ${nombre}"></td>
      <td><input type="number" class="form-control form-control-sm num" id="n_${t}" value="${Math.max(1, Math.round(kg * sug[t] / unidad))}" ${t === 'CAL' && v2 ? 'disabled' : ''} aria-label="Unidades ${nombre}"></td></tr>`;
    const res = await Swal.fire({ title: 'Cerrar ' + o.numero, width: 640, confirmButtonText: 'Cerrar OT y tarjar', showCancelButton: true, cancelButtonText: 'Cancelar', confirmButtonColor: '#2f6b3f',
      html: `<div class="small mb-2">Kg de entrada: <b>${num(kg)}</b> · tolerancia de cuadratura ±2 %</div>
        <table class="table table-sm align-middle"><thead><tr><th class="text-start">Salida</th><th>Kg</th><th>Unidades</th></tr></thead><tbody>
        ${fila('PT', 'Pallet PT', 900)}${fila('CAL', 'Bin Calibrado', 380)}${fila('COM', 'Bin Comercial', 380)}${fila('DES', 'Bin Desecho', 400)}</tbody></table>
        <div class="row g-2"><div class="col"><input id="cCal" class="form-control form-control-sm" placeholder="Calibre (ej. 113)" aria-label="Calibre"></div>
        <div class="col"><input id="cCol" class="form-control form-control-sm" placeholder="Color (ej. ${esc(COLORES[o.variedad])})" aria-label="Color"></div></div>
        <div class="mt-2 small" id="cuad"></div>`,
      didOpen: () => { const calc = () => { const t = [...document.querySelectorAll('.kgSal')].reduce((a, i) => a + (i.disabled ? 0 : parseFloat(i.value) || 0), 0);
          const p = (t - kg) / kg * 100, okk = Math.abs(p) <= TOLERANCIA_KG * 100;
          document.getElementById('cuad').innerHTML = `Salida: <b>${num(t)}</b> kg · diferencia <b class="${okk ? 'text-success' : 'text-danger'}">${num(p)} %</b> ${okk ? '✔' : '✖ fuera de tolerancia'}`; };
        document.querySelectorAll('.kgSal').forEach(i => i.addEventListener('input', calc)); calc(); },
      preConfirm: () => { const d = { calibre: document.getElementById('cCal').value.trim(), color: document.getElementById('cCol').value.trim() };
        ['PT', 'CAL', 'COM', 'DES'].forEach(t => { const k = document.getElementById('kg_' + t); if (!k.disabled) d[t] = [parseFloat(k.value) || 0, parseInt(document.getElementById('n_' + t).value, 10) || 0]; }); return d; } });
    if (!res.isConfirmed) return;
    const d = res.value;
    const r = accion('ordenes', 'RW', () => {
      if (o.estado !== 'En proceso') return { ok: false, msg: 'La OT no está en proceso' };
      const dest = { PT: ['Pre-frío 1', 'En pre-frío'], CAL: ['Cámara Calibrado', 'En cámara'], COM: ['Patio Comercial', 'En patio'], DES: ['Patio Desecho', 'En patio'] };
      const sal = Object.entries(dest).filter(([t]) => d[t] && d[t][0] > 0);
      const kgTot = sum(sal, ([t]) => d[t][0]), pct = Math.abs(kgTot - kg) / kg;
      if (pct > TOLERANCIA_KG) return { ok: false, msg: `Cuadratura de kilos fuera de tolerancia: entrada ${num(kg, 1)} kg, salida ${num(kgTot, 1)} kg (diferencia ${num(pct * 100, 1)} %). Máximo permitido ±2 %.` };
      const tarjas = [];
      sal.forEach(([t, [dn, est]]) => { const n = Math.max(1, d[t][1]), did = ubicId(dn);
        for (let i = 0; i < n; i++) { const bn = nuevoBin(t, { variedad: o.variedad, calibre: t === 'DES' ? null : d.calibre || null, color: t === 'DES' ? null : d.color || null,
          kg: Math.round(d[t][0] / n * 10) / 10, ubicacion_id: did, estado: est, ot: o.id, usuario: yo.usuario });
          mov(bn.id, 'Tarjado', o.linea_id, did, yo.usuario, 'Salida de ' + o.numero); tarjas.push(bn.tarja); } });
      db.ot_bins.filter(x => x.ot_id === o.id).forEach(x => { binId(x.bin_id).estado = 'Procesado'; });
      Object.assign(o, { estado: 'Cerrada', kg_salida: Math.round(kgTot * 10) / 10, cerrado_en: ahora(), observacion: `Cuadratura OK (${num(pct * 100, 1)} %)` });
      return { ok: true, msg: o.numero + ' cerrada', tarjas };
    });
    if (!r.ok) return error(r.msg);
    await Swal.fire({ icon: 'success', title: r.msg, html: `${r.tarjas.length} tarjas generadas:<br><span class="gt-tarja small">${r.tarjas.map(esc).join(', ')}</span>`, confirmButtonColor: '#2f6b3f' });
    recargar();
  });
};

VISTAS.movimientos = function () {

  const pend = db.movimientos.filter(m => m.estado === 'Pendiente').sort((a, b) => a.fecha.localeCompare(b.fecha));
  const movs = [...db.movimientos].sort((a, b) => b.fecha.localeCompare(a.fecha) || b.id - a.id);

  <div class="row g-3 mb-3">

      <div class="gt-scan-wrap mb-2"><i class="bi bi-upc-scan"></i><input id="mvTarja" class="form-control form-control-lg gt-scan" placeholder="Escanear tarja…" aria-label="Tarja"></div>

            ${db.ubicaciones.filter(u => u.tipo !== 'Línea').map(u => `<option value="${u.id}">${esc(u.nombre)} (${esc(u.tipo)})</option>`).join('')}</select></div>
          <div class="col-md-6"><label class="form-label small mb-1" for="mvMotivo">Motivo</label><select class="form-select" id="mvMotivo">

        </div>

        <button class="btn btn-gt w-100 mt-2"><i class="bi bi-arrow-left-right me-1"></i>Mover</button>
      </form></div></div>` : ''}
    <div class="${rw ? 'col-xl-7' : 'col-12'}"><div class="gt-card"><h6><i class="bi bi-hourglass-split me-1"></i>Pendientes de aprobación (${pend.length})</h6>
      ${pend.length ? pend.map(m => { const b = binId(m.bin_id); return `<div class="d-flex flex-wrap align-items-center gap-2 border-bottom py-2"><div class="flex-grow-1">
        <div><span class="gt-tarja">${esc(b.tarja)}</span> · ${esc(b.variedad)} · ${num(b.kg, 0)} kg</div>
        <div class="small text-muted">${esc(ubicNom(m.origen_id))} → <b>${esc(ubicNom(m.destino_id))}</b> · ${esc(m.motivo)} · por ${esc(m.usuario)}, ${fC(m.fecha)}</div></div>
        ${aprueba ? `<button class="btn btn-sm btn-outline-success" data-res="aprobar" data-id="${m.id}"><i class="bi bi-check-lg"></i> Aprobar</button>
          <button class="btn btn-sm btn-outline-danger" data-res="rechazar" data-id="${m.id}" title="Rechazar"><i class="bi bi-x-lg"></i></button>` : '<span class="badge st st-warn">Pendiente</span>'}</div>`; }).join('')
        : '<div class="text-muted small">No hay movimientos pendientes.</div>'}

  </div>
  <div class="gt-card"><h6>Historial de movimientos</h6>
    <table id="tblMov" class="table table-sm table-striped table-hover w-100 nowrap"><thead><tr><th>Fecha</th><th>Tarja</th><th>Unidad</th><th>Variedad</th><th>Tipo</th><th>Origen</th><th>Destino</th><th>Motivo</th><th>Usuario</th><th>Estado</th><th>Aprobó</th></tr></thead><tbody>
    ${movs.map(m => { const b = binId(m.bin_id); return `<tr><td class="small" data-order="${m.fecha}">${fF(m.fecha)}</td><td>${linkT(b.tarja)}</td><td class="small">${TIPO_BIN[b.tipo][0]}</td>
      <td class="small">${esc(b.variedad)}</td><td>${esc(m.tipo)}</td><td class="small">${esc(ubicNom(m.origen_id) || '—')}</td><td class="small">${esc(ubicNom(m.destino_id) || '—')}</td>
      <td class="small">${esc(m.motivo)}</td><td class="small">${esc(m.usuario)}</td><td>${badge(m.estado)}</td><td class="small">${esc(m.aprobado_por || '')}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  $('#tblMov').DataTable({ order: [[0, 'desc']], scrollX: true });

  if (rw) {
    const txt = document.getElementById('mvTarja'), frm = document.getElementById('frmMov'), info = document.getElementById('infoBin');
    let actual = null;
    txt.focus();
    txt.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return; e.preventDefault();
      const b = binTarja(txt.value);
      if (!b) { info.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Tarja no encontrada</span>'; frm.hidden = true; return; }
      actual = b; txt.value = b.tarja;
      info.innerHTML = `<div class="p-2 rounded" style="background:#f4f7f3"><span class="gt-tarja">${esc(b.tarja)}</span> ${tipoBin(b.tipo)} ${badge(b.estado)}<br>
        ${esc(b.variedad)}${b.calibre ? ' · cal. ' + esc(b.calibre) : ''} · ${num(b.kg)} kg · <i class="bi bi-geo-alt"></i> <b>${esc(ubicNom(b.ubicacion_id) || '—')}</b>
        ${b.plaga ? `<br><span class="text-danger"><i class="bi bi-bug"></i> ${esc(b.plaga)}</span>` : ''}</div>`;
      frm.hidden = false; document.getElementById('mvDest').focus();
    });

        const b = actual;
        if (!dest) return { ok: false, msg: 'Selecciona el destino' };
        if (dest === b.ubicacion_id) return { ok: false, msg: 'El bin ya está en ese destino' };
        if (['Procesado', 'En proceso', 'Despachado'].includes(b.estado)) return { ok: false, msg: `El bin está ${b.estado} y no se puede mover` };
        const dn = ubicNom(dest);
        if (b.estado === 'Objetado' && dn !== 'Patio Desecho') return { ok: false, msg: 'Bin objetado por Control de Calidad: solo puede ir a Patio Desecho o ser liberado por CC' };
        if (db.movimientos.some(m => m.bin_id === b.id && m.estado === 'Pendiente')) return { ok: false, msg: 'El bin ya tiene un movimiento pendiente de aprobación' };
        if (MOTIVOS_AUTO.includes(motivo)) {
          let est = b.estado;
          if (dn === 'Despachado') est = 'Despachado'; else if (dn === 'Inspección SAG') est = 'Inspección SAG';
          else if (dn.startsWith('Pre-frío')) est = 'En pre-frío'; else if (dn.startsWith('C.F.')) est = 'Almacenado';
          else if (dn.startsWith('Cámara') && b.estado === 'Inspección SAG') est = 'En cámara';
          mov(b.id, dn === 'Despachado' ? 'Despacho' : 'Movimiento', b.ubicacion_id, dest, yo.usuario, motivo);
          b.ubicacion_id = dest; b.estado = est;
          return { ok: true, msg: `${b.tarja} movido a ${dn}` };
        }
        mov(b.id, 'Movimiento', b.ubicacion_id, dest, yo.usuario, 'Otro: ' + (det || 'sin detalle'), 'Pendiente', null);
        return { ok: true, pendiente: true, msg: 'Movimiento enviado a aprobación del Jefe de Turno' };
      });
      if (!r.ok) return error(r.msg);
      await Swal.fire({ icon: r.pendiente ? 'info' : 'success', title: r.msg, timer: 1800, showConfirmButton: false });
      recargar();
    });
  }
  $main().querySelectorAll('[data-res]').forEach(btn => btn.onclick = async () => {
    const ap = btn.dataset.res === 'aprobar';
    if (!await confirmar(ap ? '¿Aprobar movimiento?' : '¿Rechazar movimiento?', '', ap ? 'Aprobar' : 'Rechazar', !ap)) return;
    const r = accion('movimientos', 'RW', () => {
      if (!['Administrador', 'Jefe de Turno'].includes(yo.perfil)) return { ok: false, msg: 'Solo el Jefe de Turno o el Administrador aprueban movimientos' };
      const m = db.movimientos.find(x => x.id === +btn.dataset.id && x.estado === 'Pendiente');
      if (!m) return { ok: false, msg: 'Movimiento no encontrado o ya resuelto' };
      m.estado = ap ? 'Aprobado' : 'Rechazado'; m.aprobado_por = yo.usuario;
      if (ap) binId(m.bin_id).ubicacion_id = m.destino_id;
      return { ok: true, msg: ap ? 'Movimiento aprobado' : 'Movimiento rechazado' };
    });
    if (!r.ok) return error(r.msg);
    await ok(r.msg); recargar();
  });
};

      ${objetados.map(o => `<tr><td>${linkT(o.tarja)}</td><td>${esc(o.variedad)}</td><td class="num">${num(o.kg, 1)}</td><td class="text-danger">${esc(o.plaga)}</td><td>${esc(o.guia)}</td><td>${esc(prod(o.productor_id)?.nombre)}</td><td>${esc(ubicNom(o.ubicacion_id))}</td></tr>`).join('')}

  txt.focus();
  if (!tarja) return;
  txt.value = tarja;
  const b = binTarja(tarja);
  if (!b) { out.innerHTML = `<div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-1"></i>Tarja ${esc(tarja)} no encontrada</div>`; return; }
  const p = prod(b.productor_id), cc = puede('trazabilidad', 'RW');
  const movs = db.movimientos.filter(m => m.bin_id === b.id).sort((a, c) => a.fecha.localeCompare(c.fecha) || a.id - c.id);
  const icono = { 'Recepción': 'bi-truck', 'Movimiento': 'bi-arrow-left-right', 'Abastecimiento': 'bi-gear', 'Tarjado': 'bi-tag', 'Objeción': 'bi-bug', 'Liberación': 'bi-shield-check', 'Despacho': 'bi-send' };
  const otO = b.ot_origen_id ? db.ots.find(o => o.id === b.ot_origen_id) : null;
  const ent = otO ? db.ot_bins.filter(x => x.ot_id === otO.id).map(x => binId(x.bin_id)) : [];
  const rel = db.ot_bins.find(x => x.bin_id === b.id), otD = rel ? db.ots.find(o => o.id === rel.ot_id) : null;
  const sal = otD ? db.bins.filter(x => x.ot_origen_id === otD.id) : [];
  const fila = (k, v) => v ? `<tr><th class="text-muted fw-normal">${k}</th><td>${v}</td></tr>` : '';
  let acc = '';
  if (cc && b.estado === 'Objetado') acc = '<button class="btn btn-sm btn-outline-success" id="btnLiberar"><i class="bi bi-shield-check"></i> Liberar</button>';
  else if (cc && ['En cámara', 'Asignado OT'].includes(b.estado)) acc = '<button class="btn btn-sm btn-outline-danger" id="btnObjetar"><i class="bi bi-bug"></i> Objetar por plaga</button>';
  const prods = [...new Set(ent.map(e => prod(e.productor_id)?.nombre).filter(Boolean))];
  out.innerHTML = `<div class="row g-3">
    <div class="col-lg-4"><div class="gt-card">
      <div class="d-flex justify-content-between align-items-start mb-2"><div><div class="gt-tarja fs-4">${esc(b.tarja)}</div><div>${tipoBin(b.tipo)} ${badge(b.estado)}</div></div><div>${acc}</div></div>
      <table class="table table-sm mb-0">${fila('Variedad', esc(b.variedad))}${fila('Calibre', esc(b.calibre))}${fila('Color', esc(b.color))}${fila('Kg', num(b.kg))}
        ${fila('Ubicación actual', '<i class="bi bi-geo-alt"></i> ' + esc(ubicNom(b.ubicacion_id) || '—'))}${b.plaga ? `<tr><th class="text-muted fw-normal">Plaga</th><td class="text-danger fw-semibold">${esc(b.plaga)}</td></tr>` : ''}
        ${fila('Guía', esc(b.guia))}${p ? fila('Productor', `${esc(p.nombre)}<div class="small text-muted">${esc(p.huerto)} · ${esc(p.comuna)}</div>`) : ''}${fila('Creado', fF(b.fecha_creacion) + ' · ' + esc(b.usuario))}</table>
    </div></div>
    <div class="col-lg-4">
      ${otO ? `<div class="gt-card mb-3"><h6><i class="bi bi-arrow-up-circle me-1"></i>Origen · ${esc(otO.numero)}</h6>
        <div class="small mb-2">${esc(ubicNom(otO.linea_id))} · ${otO.vuelta === 1 ? '1ra vuelta' : '2da vuelta'} · cerrada ${fF(otO.cerrado_en)}</div>
        ${prods.length ? `<div class="small mb-2"><b>Productores:</b> ${prods.map(esc).join(', ')}</div>` : ''}
        <div class="small"><b>${ent.length} bins de entrada:</b><br>${ent.map(e => linkT(e.tarja) + (e.guia ? ` <span class="text-muted">(${esc(e.guia)})</span>` : '')).join(' · ')}</div></div>` : ''}
      ${otD ? `<div class="gt-card mb-3"><h6><i class="bi bi-arrow-down-circle me-1"></i>Consumido en ${esc(otD.numero)} ${badge(otD.estado)}</h6>
        <div class="small mb-2">${esc(ubicNom(otD.linea_id))} · ${esc(otD.variedad)}</div>
        ${sal.length ? `<table class="table table-sm mb-0"><thead><tr><th>Tarja</th><th>Tipo</th><th class="num">Kg</th><th>Estado</th></tr></thead><tbody>
          ${sal.map(s => `<tr><td>${linkT(s.tarja)}</td><td>${tipoBin(s.tipo)}</td><td class="num">${num(s.kg)}</td><td>${badge(s.estado)}</td></tr>`).join('')}</tbody></table>`
          : '<div class="small text-muted">La OT aún no genera salidas.</div>'}</div>` : ''}
      ${!otO && !otD ? '<div class="gt-card text-muted small">Sin órdenes de trabajo asociadas todavía.</div>' : ''}
    </div>
    <div class="col-lg-4"><div class="gt-card"><h6>Historial</h6><ul class="gt-timeline">
      ${movs.map(m => `<li><span class="dot ${m.tipo === 'Objeción' ? 'bad' : ''}"><i class="bi ${icono[m.tipo] || 'bi-dot'}"></i></span>
        <div class="t">${esc(m.tipo)} ${m.estado !== 'Aprobado' ? badge(m.estado) : ''}</div>
        <div>${m.origen_id || m.destino_id ? esc(ubicNom(m.origen_id) || '—') + ' → <b>' + esc(ubicNom(m.destino_id) || '—') + '</b>' : ''} <span class="small text-muted">${esc(m.motivo || '')}</span></div>
        <div class="m">${fF(m.fecha)} · ${esc(m.usuario)}${m.aprobado_por && m.aprobado_por !== 'auto' ? ' · aprobó ' + esc(m.aprobado_por) : ''}</div></li>`).join('')}
    </ul></div></div></div>`;

  document.getElementById('btnObjetar')?.addEventListener('click', async () => {
    const { value: plaga } = await Swal.fire({ title: 'Objetar ' + b.tarja, input: 'select', inputPlaceholder: 'Plaga detectada…',
      inputOptions: { 'Pulgón lanígero': 'Pulgón lanígero', 'Arañita roja': 'Arañita roja', 'Chanchito blanco': 'Chanchito blanco', 'Chanchito rojo': 'Chanchito rojo', 'Escama de San José': 'Escama de San José' },
      showCancelButton: true, confirmButtonText: 'Objetar', cancelButtonText: 'Cancelar', confirmButtonColor: '#b8323a', inputValidator: v => !v && 'Selecciona la plaga' });
    if (!plaga) return;
    const r = accion('trazabilidad', 'RW', () => {
      if (!['En cámara', 'Asignado OT'].includes(b.estado)) return { ok: false, msg: 'Solo se pueden objetar bins en cámara' };
      if (b.estado === 'Asignado OT') { // se libera de la OT planificada
        const rel2 = db.ot_bins.find(x => x.bin_id === b.id), ot = rel2 && db.ots.find(o => o.id === rel2.ot_id && o.estado === 'Planificada');
        if (ot) { db.ot_bins = db.ot_bins.filter(x => x !== rel2); ot.kg_entrada = Math.round(sum(db.ot_bins.filter(x => x.ot_id === ot.id), x => binId(x.bin_id).kg) * 10) / 10; }
      }
      b.estado = 'Objetado'; b.plaga = plaga; mov(b.id, 'Objeción', null, null, yo.usuario, 'Plaga: ' + plaga, 'Aprobado', null);
      return { ok: true, msg: `${b.tarja} objetado por ${plaga}` };
    });
    if (!r.ok) return error(r.msg);
    await ok(r.msg); recargar();
  });
  document.getElementById('btnLiberar')?.addEventListener('click', async () => {
    const res = await Swal.fire({ title: 'Liberar ' + b.tarja, input: 'text', inputPlaceholder: 'Observación (ej. tratamiento aplicado)', showCancelButton: true,
      confirmButtonText: 'Liberar', cancelButtonText: 'Cancelar', confirmButtonColor: '#2f6b3f' });
    if (!res.isConfirmed) return;
    const r = accion('trazabilidad', 'RW', () => { b.estado = 'En cámara'; b.plaga = null;
      mov(b.id, 'Liberación', null, null, yo.usuario, res.value || 'Liberado por Control de Calidad', 'Aprobado', null); return { ok: true, msg: b.tarja + ' liberado' }; });
    if (!r.ok) return error(r.msg);
    await ok(r.msg); recargar();
  });
};

          ${u.id !== yo.id ? `<button class="btn btn-sm ${u.estado === 'Activo' ? 'btn-outline-danger' : 'btn-outline-success'}" data-estado="${u.id}" title="${u.estado === 'Activo' ? 'Desactivar' : 'Activar'}"><i class="bi ${u.estado === 'Activo' ? 'bi-person-slash' : 'bi-person-check'}"></i></button>` : ''}</td></tr>`).join('')}
      </tbody></table>

    <div class="tab-pane fade" id="tabP">

      <div class="table-responsive"><table class="table table-bordered gt-matriz" id="tblMatriz"><thead class="table-light"><tr><th>Módulo</th>
        ${db.perfiles.map(p => `<th>${esc(p.nombre)}<div class="small fw-normal text-muted">${db.usuarios.filter(u => u.perfil_id === p.id).length} usuario(s)</div></th>`).join('')}</tr></thead><tbody>
        ${Object.entries(MODULOS).map(([k, m]) => `<tr><td><i class="bi ${m[1]} me-1"></i>${m[0]}</td>${db.perfiles.map(p => { const n = nivelDe(p.id, k), bloq = p.nombre === 'Administrador' || k === 'dashboard';
          return `<td><select class="form-select form-select-sm" data-perfil="${p.id}" data-modulo="${k}" ${bloq ? 'disabled' : ''} aria-label="${esc(p.nombre)} ${m[0]}">
            <option value="RW" ${n === 'RW' ? 'selected' : ''}>✅ Completo</option><option value="R" ${n === 'R' ? 'selected' : ''}>👁 Lectura</option><option value="" ${n === '' ? 'selected' : ''}>❌ Sin acceso</option></select></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="row g-2 mt-1">${db.perfiles.map(p => `<div class="col-md-6 col-xl-3 small"><b>${esc(p.nombre)}:</b> <span class="text-muted">${esc(p.descripcion)}</span></div>`).join('')}</div>
      <div class="text-end mt-3"><button class="btn btn-gt" id="btnMatriz"><i class="bi bi-save me-1"></i>Guardar permisos</button></div>

      <div class="mb-2"><label class="form-label small mb-1" for="uPerfil">Perfil</label><select class="form-select" id="uPerfil">${db.perfiles.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select></div>
      <div class="mb-2"><label class="form-label small mb-1" for="uClave">Contraseña <span class="text-muted" id="uClaveTxt"></span></label>

  $('#tblU').DataTable({ order: [], columnDefs: [{ targets: -1, orderable: false, searchable: false }] });
  const mdl = bootstrap.Modal.getOrCreateInstance(document.getElementById('mdlU'));

  const abrir = (u) => { edit = u;
    document.getElementById('uUsuario').value = u ? u.usuario : ''; document.getElementById('uNombre').value = u ? u.nombre : '';
    document.getElementById('uPerfil').value = u ? u.perfil_id : db.perfiles[db.perfiles.length - 1].id; document.getElementById('uNotas').value = u ? u.notas || '' : '';

  document.getElementById('btnNuevo').onclick = () => abrir(null);

  document.getElementById('frmU').addEventListener('submit', async ev => {
    ev.preventDefault();
    const usr = document.getElementById('uUsuario').value.trim().toLowerCase(), nom = document.getElementById('uNombre').value.trim(),
      pid = +document.getElementById('uPerfil').value, cl = document.getElementById('uClave').value, notas = document.getElementById('uNotas').value.trim();
    const r = accion('administracion', 'RW', () => {
      if (!/^[a-z0-9._-]{3,40}$/.test(usr)) return { ok: false, msg: 'Usuario inválido (3-40 caracteres: letras, números, . _ -)' };
      if (!nom) return { ok: false, msg: 'El nombre es obligatorio' };
      if (db.usuarios.some(u => u.usuario === usr && u !== edit)) return { ok: false, msg: 'El usuario ya existe' };
      if ((!edit || cl) && cl.length < 6) return { ok: false, msg: 'La contraseña debe tener al menos 6 caracteres' };
      if (edit) { if (edit.id === yo.id && pid !== edit.perfil_id) return { ok: false, msg: 'No puedes cambiar tu propio perfil' };

      return { ok: true, msg: 'Usuario creado' };

  };
};
